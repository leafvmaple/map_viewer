# Build the frontend image and push it to the Gitea container registry on every
# push to main. The NAS then `docker compose pull && up -d`. Mirrors
# vn-resource-vault. Requires repo secrets REGISTRY_USER / REGISTRY_TOKEN, and
# the runner must trust the (HTTP) registry host.
name: build-and-push
on:
  push:
    branches: [ main ]

env:
  REGISTRY: 10.0.0.20:42197
  IMAGE: 10.0.0.20:42197/leafvmaple/map_viewer

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
