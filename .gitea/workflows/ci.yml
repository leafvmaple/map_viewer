name: CI

# Runs on the self-hosted Gitea act_runner. On push to main it builds the static
# frontend image and pushes it to Gitea's built-in container registry; the NAS
# then pulls it (`docker compose pull && up -d`). Nothing leaves the NAS — no
# GitHub, no ghcr.io. Mirrors vn-resource-vault's CI.
on:
  push:
    branches: [main]

jobs:
  build-push:
    # Match a label your act_runner registered with. `ubuntu-latest` is the
    # common default; change it if your runner uses a different label.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive registry + image metadata
        id: meta
        run: |
          # github.server_url is Gitea's ROOT_URL, e.g. http://10.0.0.20:42197
          # -> registry host 10.0.0.20:42197. github.repository -> leafvmaple/map-viewer.
          REGISTRY=$(echo "${{ github.server_url }}" | sed -E 's#^https?://##')
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "image=$REGISTRY/${{ github.repository }}" >> "$GITHUB_OUTPUT"

      - name: Log in to the Gitea container registry
        # The auto-provided token can push packages for the repo owner. If your
        # instance restricts that, add a REGISTRY_TOKEN secret (PAT, write:package).
        run: |
          echo "${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}" \
            | docker login "${{ steps.meta.outputs.registry }}" \
                -u "${{ github.actor }}" --password-stdin

      - name: Build + push (versioned + latest)
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"
          docker build -t "$IMAGE:latest" -t "$IMAGE:v${{ github.run_number }}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:v${{ github.run_number }}"

      - name: Prune dangling images
        run: docker image prune -f
