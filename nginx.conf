server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml;

  # Hashed app bundle (assets/index-<hash>.{js,css}) — safe to cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Game data mounted read-only from the NAS (= a retro_decoder export target):
  #   /data/res/{game}/...              images + game.json
  #   /data/public/games/registry.json  list of games
  # no-cache = always revalidate (cheap 304s), so re-exported data shows up
  # immediately without re-downloading unchanged images.
  location /res/ {
    alias /data/res/;
    add_header Cache-Control "no-cache";
  }
  location /games/ {
    alias /data/public/games/;
    add_header Cache-Control "no-cache";
  }

  # SPA entry (hash routing lives under index.html).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
